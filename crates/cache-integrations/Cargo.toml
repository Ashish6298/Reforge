[package]
name = "dcc-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic developer integrations and adapters for DCC (build tools, linters, code generators)"

[dependencies]
dcc-core = { path = "../cache-core" }
dcc-storage = { path = "../cache-storage" }
dcc-runner = { path = "../cache-runner" }
serde = { workspace = true }
