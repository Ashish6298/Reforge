name: CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-and-sync:
    name: Auto-format Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt and commit if needed
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "style: apply cargo fmt across workspace"
            git push origin HEAD:${{ github.ref }} || true
          fi

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: fmt-and-sync
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Run Examples Suite
        run: |
          cargo run --example cached_codegen
          cargo run --example cached_analysis
          cargo run --example cached_transform
          cargo run --example cached_rust_build
          cargo run --example build_demonstration
          cargo run --example build_benchmark

  release-candidate-gate:
    name: Release Candidate Gate
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Full Cross-Platform Matrix Pass
        run: |
          echo "==============================================================="
          echo "All jobs in cross-platform matrix passed successfully!"
          echo "Platforms verified: ubuntu-latest, windows-latest, macos-latest"
          echo "Release candidate criteria satisfied for DCC v1.0.0."
          echo "==============================================================="