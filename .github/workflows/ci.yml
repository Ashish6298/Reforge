name: CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Code (cargo fmt)
        run: cargo fmt --all

      - name: Run Workspace Tests
        shell: bash
        run: |
          set +e
          cargo test --workspace -- --nocapture > test_output.txt 2>&1
          STATUS=$?
          echo "## Test Output (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt
          exit $STATUS

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets --all-features

  release-candidate-gate:
    name: Release Candidate Gate
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Full Cross-Platform Matrix Pass
        run: |
          echo "==============================================================="
          echo "All jobs in cross-platform matrix passed successfully!"
          echo "Platforms verified: ubuntu-latest, windows-latest, macos-latest"
          echo "Release candidate criteria satisfied for DCC v1.0.0."
          echo "==============================================================="